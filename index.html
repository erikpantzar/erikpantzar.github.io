<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Erik Pantzar — agentic engineer, product developer. Stockholm, Sweden.">
  <meta name="color-scheme" content="light dark">
  <title>erik pantzar — agentic engineer · product developer</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f4f1ea;
      --fg: #191919;
      --dim: #77726a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0d10;
        --fg: #e6e4de;
        --dim: #84878f;
      }
    }
    html { background: var(--bg); color: var(--fg); }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', monospace;
      text-align: center;
      padding: 32px 16px;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      max-width: 760px;
    }
    #art {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(7px, 1.7vw, 13px);
      line-height: 1.12;
      color: var(--fg);
      user-select: none;
    }
    h1 {
      font-size: clamp(14px, 3.4vw, 22px);
      letter-spacing: 1px;
      font-weight: normal;
    }
    h1::after {
      content: "_";
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .tag {
      font-size: clamp(8px, 1.7vw, 11px);
      color: var(--dim);
      line-height: 2;
    }
    nav { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
    nav a {
      font-size: 9px;
      color: var(--fg);
      text-decoration: none;
      border-bottom: 2px solid var(--fg);
      padding-bottom: 4px;
    }
    nav a:hover { color: var(--dim); border-color: var(--dim); }
    .worked { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
    .worked h2 {
      font-size: 8px;
      color: var(--dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: normal;
    }
    .logos {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      list-style: none;
    }
    .logos li {
      font-size: 8px;
      line-height: 1;
      border: 2px solid var(--fg);
      padding: 9px 11px;
      box-shadow: 3px 3px 0 var(--fg);
    }
    footer { font-size: 8px; color: var(--dim); margin-top: 6px; }
    @media (prefers-reduced-motion: reduce) {
      h1::after { animation: none; }
    }
  </style>
</head>
<body>
<main>
  <pre id="art" aria-hidden="true"></pre>

  <h1>erik pantzar</h1>
  <p class="tag">agentic engineer · product developer</p>

  <nav>
    <a href="https://github.com/erikpantzar">github</a>
    <a href="https://www.linkedin.com/in/erikpantzar">linkedin</a>
    <a href="https://x.com/epantzar">x</a>
  </nav>

  <section class="worked">
    <h2>worked at</h2>
    <!-- To swap a text chip for a real logo, replace the <li> text with an inline
         <svg> (use currentColor for fills so it works in light + dark mode). -->
    <ul class="logos">
      <li>TENEO.AI</li>
      <li>CAUSALITY</li>
      <li>SIGMA TECHNOLOGY</li>
    </ul>
  </section>

  <footer>stockholm, sweden</footer>
</main>

<script>
(() => {
  // Spinning torus, rendered with a z-buffer and a luminance ramp.
  const el = document.getElementById("art");
  const W = 64, H = 24, K1 = W * 0.28;
  const SH = ".,-~:;=!*#$@";

  function render(A, B) {
    const b = Array(W * H).fill(" "), zb = Array(W * H).fill(0);
    const cA = Math.cos(A), sA = Math.sin(A), cB = Math.cos(B), sB = Math.sin(B);
    for (let th = 0; th < 6.283; th += 0.07) {
      const ct = Math.cos(th), st = Math.sin(th);
      for (let ph = 0; ph < 6.283; ph += 0.02) {
        const cp = Math.cos(ph), sp = Math.sin(ph);
        const h = ct + 2;
        const D = 1 / (sp * h * sA + st * cA + 5);
        const tt = sp * h * cA - st * sA;
        const x = (W / 2 + K1 * D * (cp * h * cB - tt * sB)) | 0;
        const y = (H / 2 + K1 * 0.5 * D * (cp * h * sB + tt * cB)) | 0;
        const o = x + W * y;
        const N = (8 * ((st * sA - sp * ct * cA) * cB - sp * ct * sA - st * cA - cp * ct * sB)) | 0;
        if (y >= 0 && y < H && x >= 0 && x < W && D > zb[o]) {
          zb[o] = D;
          b[o] = SH[Math.max(N, 0)];
        }
      }
    }
    const rows = [];
    for (let y = 0; y < H; y++) rows.push(b.slice(y * W, y * W + W).join(""));
    el.textContent = rows.join("\n");
  }

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    render(1.0, 0.4);
    return;
  }
  function tick(ms) {
    render(ms / 1000 * 0.9, ms / 1000 * 0.5);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
