<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Erik Pantzar is a full-stack developer building elegant solutions from database to deployment.">
  <title>Erik Pantzar</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090909;
      --panel: rgba(255, 255, 255, 0.06);
      --panel-strong: rgba(255, 255, 255, 0.1);
      --text: #f5f5f3;
      --muted: #9b9b9f;
      --line: rgba(255, 255, 255, 0.09);
      --glow: rgba(100, 83, 255, 0.34);
      --radius: 999px;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background:
        radial-gradient(circle at 14% 88%, rgba(84, 35, 136, 0.24), transparent 26%),
        radial-gradient(circle at 100% 18%, rgba(23, 89, 160, 0.18), transparent 22%),
        linear-gradient(180deg, #111 0%, #070707 100%);
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "SF Pro Display", "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--text);
      background: transparent;
    }

    main {
      min-height: 100vh;
      margin: 0;
      padding: 18px 20px;
      display: flex;
    }

    .frame {
      width: 100%;
      min-height: 100%;
      padding: clamp(18px, 4vw, 42px);
      border: 1px solid rgba(255, 255, 255, 0.03);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.015), rgba(255, 255, 255, 0));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      display: flex;
      flex-direction: column;
    }

    .eyebrow {
      margin: 0 0 clamp(64px, 12vw, 132px);
      color: #7d7d82;
      font-size: 0.95rem;
      letter-spacing: -0.02em;
    }

    .eyebrow strong {
      color: #e8e8e9;
      font-weight: 650;
    }

    .hero {
      max-width: 780px;
      
    }

    .pills,
    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .pill,
    .icon-link {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 14px;
      font-size: 0.86rem;
      color: #d9d9db;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .pill--active {
      background: linear-gradient(180deg, rgba(100, 83, 255, 0.18), rgba(46, 34, 91, 0.28));
      border-color: rgba(100, 83, 255, 0.42);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 0 24px var(--glow);
    }

    h1 {
      margin: 24px 0 18px;
      font-size: clamp(3.6rem, 10vw, 6.3rem);
      line-height: 0.96;
      letter-spacing: -0.06em;
    }

    p {
      margin: 0 0 34px;
      color: var(--muted);
      font-size: clamp(1.45rem, 3.2vw, 2.1rem);
      line-height: 1.14;
      letter-spacing: -0.04em;
      font-weight: 540;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 0 22px;
      border: 0;
      border-radius: var(--radius);
      background: #f5f5f3;
      color: #111;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      box-shadow: var(--shadow);
    }

    .cta svg,
    .icon-link svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .socials {
      margin-top: 42px;
    }

    .icon-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      color: #d8d8da;
    }

    @media (max-width: 720px) {
      main {
        padding: 12px;
      }

      .frame {
        min-height: 100%;
        padding: 22px 18px 28px;
      }

      .eyebrow {
        margin-bottom: 56px;
        font-size: 0.9rem;
      }

      .hero {
        margin-left: 0;
      }


      .cta {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="frame">
      <div class="eyebrow"><strong>EP</strong> &mdash; SE, Stockholm</div>

      <div class="hero">
        <div class="pills" aria-label="Status">
          <span class="pill">Vibe code compatible</span>
          <span class="pill pill--active">Available for freelancing</span>
        </div>

        <h1>Erik Pantzar</h1>
        <p>Full-stack developer building elegant solutions from database to deployment</p>

        <a class="cta" href="#" aria-label="Tell me about your project and budget">
          Tell me about your project and budget
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>
        </a>

        <div class="socials" aria-label="Profile links">
          <a class="icon-link" href="#" aria-label="GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 18c-4 1.5-4-2-6-2"></path>
              <path d="M15 22v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 19 4.77 5.07 5.07 0 0 0 18.91 1S17.73.65 15 2.48a13.38 13.38 0 0 0-6 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77 5.44 5.44 0 0 0 3.5 8.52c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
            </svg>
          </a>
          <a class="icon-link" href="#" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"></path>
              <path d="M2 9h4v12H2z"></path>
              <path d="M4 4a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"></path>
            </svg>
          </a>
          <a class="icon-link" href="#" aria-label="Email">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h16v12H4z"></path>
              <path d="m4 8 8 6 8-6"></path>
            </svg>
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
