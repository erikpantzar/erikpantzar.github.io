<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Erik Pantzar — agentic engineer, product developer. Stockholm, Sweden.">
  <meta name="color-scheme" content="light dark">
  <title>erik pantzar — agentic engineer · product developer</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f4f1ea;
      --fg: #191919;
      --dim: #77726a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0d10;
        --fg: #e6e4de;
        --dim: #84878f;
      }
    }
    html { background: var(--bg); color: var(--fg); }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Press Start 2P', monospace;
      text-align: center;
      padding: 32px 16px;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      max-width: 760px;
    }
    #art {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(7px, 1.7vw, 13px);
      line-height: 1.12;
      color: var(--fg);
      user-select: none;
    }
    h1 {
      font-size: clamp(14px, 3.4vw, 22px);
      letter-spacing: 1px;
      font-weight: normal;
    }
    h1::after {
      content: "_";
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .tag {
      font-size: clamp(8px, 1.7vw, 11px);
      color: var(--dim);
      line-height: 2;
    }
    nav { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
    nav a {
      font-size: 9px;
      color: var(--fg);
      text-decoration: none;
      border-bottom: 2px solid var(--fg);
      padding-bottom: 4px;
    }
    nav a:hover { color: var(--dim); border-color: var(--dim); }
    .worked { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
    .worked h2 {
      font-size: 8px;
      color: var(--dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: normal;
    }
    .logos {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      list-style: none;
    }
    .logos li {
      font-size: 8px;
      line-height: 1;
      border: 2px solid var(--fg);
      padding: 9px 11px;
      box-shadow: 3px 3px 0 var(--fg);
    }
    footer { font-size: 8px; color: var(--dim); margin-top: 6px; }
    @media (prefers-reduced-motion: reduce) {
      h1::after { animation: none; }
    }
  </style>
</head>
<body>
<main>
  <pre id="art" aria-hidden="true"></pre>

  <h1>erik pantzar</h1>
  <p class="tag">agentic engineer · product developer</p>

  <nav>
    <a href="https://github.com/erikpantzar">github</a>
    <a href="https://www.linkedin.com/in/erikpantzar">linkedin</a>
    <a href="https://x.com/epantzar">x</a>
  </nav>

  <section class="worked">
    <h2>worked at</h2>
    <!-- To swap a text chip for a real logo, replace the <li> text with an inline
         <svg> (use currentColor for fills so it works in light + dark mode). -->
    <ul class="logos">
      <li>TENEO.AI</li>
      <li>CAUSALITY</li>
      <li>SIGMA TECHNOLOGY</li>
    </ul>
  </section>

  <footer>stockholm, sweden</footer>
</main>

<script>
(() => {
  // Rotating planet with a tilted dot ring and an orbiting moon.
  const el = document.getElementById("art");
  const W = 64, H = 26, CX = W / 2, CY = H / 2 - 1, R = 7.5;
  const SH = " .:-=+*#%@";
  const L = norm([-0.45, -0.6, 0.66]);
  function norm(v) { const l = Math.hypot(...v); return v.map(a => a / l); }

  function render(t) {
    const g = [];
    for (let y = 0; y < H; y++) g.push(new Array(W).fill(" "));

    // planet: shaded sphere with rotating surface texture
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const dx = (x - CX) / (R * 2), dy = (y - CY) / R;
        const d2 = dx * dx + dy * dy;
        if (d2 > 1) continue;
        const z = Math.sqrt(1 - d2);
        const lon = Math.atan2(dx, z) + t * 0.8;
        const lat = Math.asin(dy);
        const tex = Math.sin(lon * 3 + Math.sin(lat * 4)) * 0.5;
        const lum = (dx * L[0] + dy * L[1] + z * L[2]) * 0.75 + tex * 0.35;
        const n = (lum + 1) / 2;
        g[y][x] = SH[Math.max(0, Math.min(SH.length - 1, Math.round((1 - n) * (SH.length - 1))))];
      }
    }

    // ring of dots; front half overdraws the planet, back half only shows outside the disc
    const rr = R * 1.75;
    for (let a = 0; a < 6.283; a += 0.05) {
      const ang = a + t * 0.5;
      const x = Math.round(CX + 2 * rr * Math.cos(ang));
      const y = Math.round(CY + rr * 0.32 * Math.sin(ang));
      if (x < 0 || x >= W || y < 0 || y >= H) continue;
      const front = Math.sin(ang) > 0;
      const dx = (x - CX) / (R * 2), dy = (y - CY) / R;
      const inside = dx * dx + dy * dy <= 1;
      if (front || !inside) g[y][x] = front ? "*" : ".";
    }

    // moon travelling the ring orbit
    const m = t * 1.1;
    const mx = Math.round(CX + 2 * rr * Math.cos(m));
    const my = Math.round(CY + rr * 0.32 * Math.sin(m));
    const mFront = Math.sin(m) > 0;
    const mdx = (mx - CX) / (R * 2), mdy = (my - CY) / R;
    if (mFront || mdx * mdx + mdy * mdy > 1) {
      for (const [ox, oy, c] of [[0, 0, "@"], [-1, 0, "%"], [1, 0, "%"]]) {
        const px = mx + ox, py = my + oy;
        if (px >= 0 && px < W && py >= 0 && py < H) g[py][px] = c;
      }
    }

    el.textContent = g.map(r => r.join("")).join("\n");
  }

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    render(0.6);
    return;
  }
  function tick(ms) {
    render(ms / 1000 * 1.4);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
